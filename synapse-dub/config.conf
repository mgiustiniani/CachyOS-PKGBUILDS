# Synapse Dub configuration. Model weights are never shipped in pacman packages.
MODEL_ROOT=/var/lib/synapse/dub/models

# Preserve the ROCm default. Set to xdna or auto to prefer the optional
# timestamp-capable synapse-whisper-xdna backend with ROCm fallback.
ASR_BACKEND=openai

# XTTS-v2 uses the Coqui Public Model License (non-commercial model and outputs).
# Change to yes only after reviewing https://coqui.ai/cpml.txt
ACCEPT_NONCOMMERCIAL_MODEL_LICENSES=no

# Optional OpenAI-compatible translation endpoint.
TRANSLATION_BACKEND=llm
TRANSLATION_ENDPOINT=http://192.168.5.157:8000/v1
TRANSLATION_MODEL=deepseek-v4-flash
SPECIALIST_TRANSLATION_ENDPOINT=http://127.0.0.1:8091/v1

# Optional token for gated pyannote diarization models. Prefer exporting
# HUGGINGFACE_TOKEN in the user session instead of storing it here.
HUGGINGFACE_TOKEN=

WAV2LIP_CHECKPOINT=/var/lib/synapse/dub/models/wav2lip/wav2lip_gan.pth
WAV2LIP_S3FD=/var/lib/synapse/dub/models/wav2lip/s3fd.pth
