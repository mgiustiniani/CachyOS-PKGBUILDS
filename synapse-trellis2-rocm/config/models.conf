# TRELLIS.2 model source configuration
# Installed at /etc/synapse/trellis2-rocm/models.conf.
# All entries are intentionally editable so local mirrors can replace upstreams.

# Official TRELLIS.2 model. May be a Hugging Face repo id, local path, or file:// path.
TRELLIS2_MODEL_ID=microsoft/TRELLIS.2-4B
TRELLIS2_MODEL_URL=https://huggingface.co/microsoft/TRELLIS.2-4B

# Sparse structure decoder referenced by TRELLIS.2 pipeline.json.
TRELLIS_IMAGE_LARGE_ID=microsoft/TRELLIS-image-large
TRELLIS_IMAGE_LARGE_URL=https://huggingface.co/microsoft/TRELLIS-image-large

# DINOv3 image encoder. Official HF repo is manual-gated; ModelScope mirror worked for validation.
DINO_MODEL_ID=facebook/dinov3-vitl16-pretrain-lvd1689m
DINO_MODEL_URL=https://www.modelscope.cn/models/facebook/dinov3-vitl16-pretrain-lvd1689m
DINO_MODEL_PATH=/var/lib/synapse/trellis2/models/dino/facebook/dinov3-vitl16-pretrain-lvd1689m

# Background removal. Official TRELLIS.2 config currently requests briaai/RMBG-2.0, also gated.
# ZhengPeng7/BiRefNet worked for validation when run on CPU.
REMBG_MODEL_ID=ZhengPeng7/BiRefNet
REMBG_MODEL_URL=https://huggingface.co/ZhengPeng7/BiRefNet
REMBG_MODEL_NAME=ZhengPeng7/BiRefNet
REMBG_FORCE_CPU=1

# Cache/storage roots. Keep weights outside package/ISO/container image.
TRELLIS2_MODEL_ROOT=/var/lib/synapse/trellis2/models
HF_HOME=/var/lib/synapse/trellis2/models/huggingface
