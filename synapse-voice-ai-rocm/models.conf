# Synapse Voice AI model configuration
# Model weights remain outside pacman packages and ISO images.

# "auto" searches mounted filesystems labelled "models" and common mount paths.
VOICE_MODEL_SOURCE=auto

# copy: import weights into VOICE_MODEL_ROOT; external: use the removable archive.
VOICE_MODEL_MODE=external
VOICE_MODEL_ROOT=/var/lib/synapse/voice-ai/models

CHATTERBOX_MODEL_REL=safetensors/voice-ai/huggingface/ResembleAI/chatterbox
WHISPER_MODEL_REL=ggml/speech-recognition/whisper.cpp/ggml-large-v3-turbo-q8_0.bin

CHATTERBOX_REPO=ResembleAI/chatterbox
CHATTERBOX_REVISION=5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
WHISPER_REPO=ggerganov/whisper.cpp
WHISPER_REVISION=5359861c739e955e79d9a303bcbc70fb988958b1

VOICE_LANGUAGE=it
VOICE_DEVICE=cuda
VOICE_BIND=127.0.0.1
VOICE_PORT=8090
VOICE_LLM_ENDPOINT=http://192.168.5.157:8000/v1
VOICE_LLM_MODEL=deepseek-v4-flash
