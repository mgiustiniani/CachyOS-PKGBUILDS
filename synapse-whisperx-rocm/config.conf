# WhisperX model weights stay outside the pacman package and installation media.
MODEL_ROOT=/var/lib/synapse/whisperx/models
DEVICE=rocm

# Set to yes only after reviewing the selected pyannote diarization model terms.
ACCEPT_DIARIZATION_MODEL_TERMS=no

# Prefer the HUGGINGFACE_TOKEN environment variable for gated model access.
HUGGINGFACE_TOKEN=
